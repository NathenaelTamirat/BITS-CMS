# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.bitscollege.edu.et studio.bitscollege.edu.et;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS — CMS API (api.bitscollege.edu.et) ────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.bitscollege.edu.et;

    ssl_certificate     /etc/letsencrypt/live/api.bitscollege.edu.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bitscollege.edu.et/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "index, follow" always;
    add_header X-DNS-Prefetch-Control on always;

    client_max_body_size 12m;

    location / {
        proxy_pass         http://cms-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ─── HTTPS — CMS Studio (studio.bitscollege.edu.et) ─────────────────────────
server {
    listen 443 ssl http2;
    server_name studio.bitscollege.edu.et;

    ssl_certificate     /etc/letsencrypt/live/studio.bitscollege.edu.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.bitscollege.edu.et/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass         http://cms-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
